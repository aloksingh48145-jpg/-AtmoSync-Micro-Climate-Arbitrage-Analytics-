version: 2

sources:
  - name: raw
    database: IOT_DB
    schema: RAW
    tables:
      - name: sensor_readings
        description: >
          Raw Kafka-sourced IoT sensor readings landed by
          ingestion/snowflake_consumer.py. Payload is stored as VARIANT;
          stg_sensor_readings flattens it into typed columns.
        columns:
          - name: event_id
            description: Unique ID for the sensor reading event
          - name: raw_payload
            description: Full JSON payload as received from Kafka
          - name: loaded_at
            description: Timestamp when the row was inserted into Snowflake
