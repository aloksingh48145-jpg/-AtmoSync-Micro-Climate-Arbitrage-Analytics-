version: 2

models:
  - name: fct_spoilage_risk
    description: >
      One row per sensor reading, scored against commodity-specific safe
      temperature/humidity bands. Flags out-of-band readings and assigns an
      arbitrage_window severity tier.
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: risk_severity_score
        tests:
          - not_null
      - name: arbitrage_window
        tests:
          - accepted_values:
              values: ['none', 'moderate', 'high']

  - name: shipment_risk_summary
    description: >
      One row per shipment, aggregating spoilage risk across all its
      readings. Primary table for Superset dashboards.
    columns:
      - name: shipment_id
        tests:
          - unique
          - not_null
      - name: total_readings
        tests:
          - not_null
